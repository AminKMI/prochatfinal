<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>چت پیشرفته</title>
  <link href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; font-family: 'Vazir', sans-serif; }
    body {
      margin: 0; display: flex; height: 100vh;
      background: #f0f2f5; color: #333;
      transition: background .3s, color .3s;
    }
    body.dark {
      background: #1e1e1e; color: #f0f0f0;
    }
    /* تغییر استایل نوار بالا در دارک مود */
    body.dark .top-bar {
      background: #2c2c2c; border-color: #444;
    }
    .top-bar {
      position: fixed; top: 0; width: 100%; height: 50px;
      background: #fff; border-bottom: 1px solid #ccc;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 20;
      transition: background .3s, border-color .3s;
    }
    .top-bar button {
      background: turquoise; color: #fff; border: none;
      border-radius: 6px; cursor: pointer;
      height: 32px; padding: 0 12px;
      transition: background .3s;
    }
    .top-bar button:hover { background: #0097a7; }

    .sidebar {
      margin-top: 50px; width: 260px; background: #fff;
      border-left: 1px solid #ddd; display: flex; flex-direction: column;
      overflow-y: auto; padding: 1rem;
      transition: background .3s, border-color .3s;
      z-index: 15;
    }
    body.dark .sidebar {
      background: #2c2c2c; border-color: #444;
    }
    .chat-list { flex-grow: 1; margin-top: 1rem; }
    .chat-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #eee; padding: 8px 12px; margin-bottom: 8px;
      border-radius: 8px; cursor: pointer;
      transition: background .3s;
    }
    body.dark .chat-item { background: #444; color: #fff; }
    .chat-item:hover { background: #dcdcdc; }
    body.dark .chat-item:hover { background: #555; }
    .chat-item .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      margin-left: 8px; flex-shrink: 0; cursor: pointer;
    }

    .add-chat, .join-chat-btn, .chat-input button {
      background: turquoise; color: #fff; border: none;
      border-radius: 8px; cursor: pointer;
      padding: 0 14px; height: 36px; line-height: 36px;
      transition: background .3s;
    }
    .add-chat, .join-chat-btn {
      width: 50px; font-size: 24px; align-self: center; margin-bottom: 10px;
    }
    .add-chat:hover, .join-chat-btn:hover, .chat-input button:hover {
      background: #0097a7;
    }
    .join-input {
      width: calc(100% - 20px); margin: 0 10px 10px;
      padding: 8px; border-radius: 8px; border: 1px solid #ccc;
    }

    .chat-area {
      margin-top: 50px; flex: 1; display: flex;
      flex-direction: column; background: #f9f9f9;
      transition: background .3s;
      position: relative;
    }
    body.dark .chat-area { background: #1e1e1e; }

    #chatHeader {
      padding: 1rem; text-align: center; font-size: 24px;
      border-bottom: 1px solid #ddd;
      transition: border-color .3s;
    }
    body.dark #chatHeader { border-color: #444; }

    .chat-box {
      flex: 1; padding: 1rem; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
      position: relative;
    }

    .message {
      position: relative; display: inline-block;
      background: #d1f0f0; padding: 10px;
      border-radius: 10px; max-width: 70%; word-break: break-word;
      margin: 0 60px 0 auto; /* فاصله از نوار سمت راست */
    }
    body.dark .message { background: #2b3e3e; color: #fff; }
    .message .avatar {
      position: absolute; right: -60px; /* جفت باکس */ top: 8px;
      width: 32px; height: 32px; border-radius: 50%;
      cursor: pointer; border: 2px solid #fff; background-clip: content-box;
      z-index: 25;
    }
    body.dark .message .avatar { border-color: #2b3e3e; }
    .message .text { margin-right: 70px; white-space: pre-wrap; }

    .msg-menu, .chat-menu {
      position: absolute; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: none; flex-direction: column; z-index: 30;
      font-family: 'Vazir', sans-serif;
    }
    body.dark .msg-menu, body.dark .chat-menu { background: #2c2c2c; border-color: #444; color: #f0f0f0; }
    .msg-menu button, .chat-menu button {
      background: none; border: none; padding: 8px 12px;
      text-align: right; cursor: pointer; width: 100%;
    }
    .msg-menu button:hover, .chat-menu button:hover { background: #eee; }
    body.dark .msg-menu button:hover, body.dark .chat-menu button:hover { background: #444; }

    .chat-input {
      display: flex; gap: 10px; padding: 1rem;
      border-top: 1px solid #ddd; align-items: center;
      transition: border-color .3s;
    }
    body.dark .chat-input { border-color: #444; }
    .chat-input input[type="text"] {
      flex: 1; padding: 10px; border: 1px solid #ccc;
      border-radius: 8px;
    }
    .emoji-btn-container { position: relative; }
    .emoji-list {
      display: none; position: absolute; bottom: 45px; right: 0;
      background: #fff; border: 1px solid #ccc; border-radius: 8px;
      padding: 8px; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .emoji-list button {
      background: none; border: none; font-size: 20px; margin: 2px;
      cursor: pointer;
    }
    .emoji-list.open { display: flex; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="top-bar" id="topBar">
    <span id="chatHeader">یک چت را انتخاب کنید</span>
    <div>
      <button onclick="toggleDarkMode()">🌓</button>
      <button onclick="changeUsername()">✏️</button>
    </div>
  </div>

  <div class="sidebar">
    <input id="joinId" class="join-input" placeholder="آیدی چت را وارد کنید...">
    <button class="join-chat-btn" onclick="joinChat()">🔑</button>
    <button class="add-chat" onclick="addChat()">+</button>
    <div id="chatList" class="chat-list"></div>
    <div id="chatMenu" class="chat-menu">
      <button onclick="editChat()">ویرایش</button>
      <button onclick="deleteChat()">حذف</button>
    </div>
  </div>

  <div class="chat-area">
    <div id="chatBox" class="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="text-input" placeholder="پیام..." onkeydown="handleKey(event)">
      <div class="emoji-btn-container">
        <button onclick="toggleEmojiList()">😊</button>
        <div id="emojiList" class="emoji-list"></div>
      </div>
      <input type="file" id="file-input" style="display:none" onchange="sendFile(event)">
      <button onclick="document.getElementById('file-input').click()">📷</button>
      <button onclick="sendMessage()">ارسال</button>
    </div>
    <div id="msgMenu" class="msg-menu">
      <button onclick="replyMessage()">پاسخ</button>
      <button onclick="editMessage()">ویرایش</button>
      <button onclick="deleteMessage()">حذف</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
